name: Testler

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Birim testleri
        run: python kaynak/test/test_birim.py
        env:
          PYTHONUTF8: "1"
      - name: Dil dosyalari (Ingilizce) ve app.js sozdizimi
        run: python kaynak/test/dil_kontrol.py en
        env:
          PYTHONUTF8: "1"
      - name: Kurulum betigi sozdizimi (yalnizca Linux)
        if: runner.os == 'Linux'
        run: bash -n kurulum.sh && bash -n vaalzmusic.sh && bash -n unis.sh
